<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Owner Control Room</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body">
<header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header>
<aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="feedback.html">Feedback</a><a href="analytics.html">Analytics</a><a href="media.html">Media & Uploads</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside>
<main class="admin-main"><h1>Products</h1><p>Manage products, prices, stock and images.</p><section class="cms-section"><div class="admin-actions"><button class="btn btn-blue" id="add">＋ Add New</button><button class="btn" id="refresh">↻ Refresh</button></div><div class="table-wrap" style="margin-top:15px"><table class="admin-table"><thead><tr><th>Name/SKU</th><th>Price</th><th>Stock</th><th>Category</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section><script>
async function load(){try{const d=await pmtGet("products"),a=d?.items||[];rows.innerHTML=a.map(x=>`<tr><td>${escapeHtml(x.name)}<br><small>${escapeHtml(x.sku||x.id)}</small></td><td>₹${Number(x.price||0)}</td><td>${Number(x.stock||0)}</td><td>${escapeHtml(x.category||"Accessories")}</td><td><button class="btn" onclick='editProduct(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")||'<tr><td colspan="5">No records yet.</td></tr>';}catch(e){rows.innerHTML='<tr><td colspan="5">'+escapeHtml(e.message||"API request failed")+'</td></tr>';}}
async function editProduct(x){const name=prompt("Product name:",x.name);if(name===null)return;const price=prompt("Price:",x.price);if(price===null)return;const stock=prompt("Stock:",x.stock);if(stock===null)return;try{await pmtPost({action:"updateProduct",payload:{id:x.id,name,price:Number(price),stock:Number(stock)}});load();}catch(e){alert(e.message)}}
add.onclick=async()=>{const name=prompt("Product name:");if(!name)return;const price=prompt("Price:","0");if(price===null)return;const stock=prompt("Stock:","0");if(stock===null)return;const sku=prompt("SKU (optional):","")||"";const category=prompt("Category:","Accessories")||"Accessories";try{await pmtPost({action:"createProduct",payload:{name,price:Number(price),stock:Number(stock),sku,category}});load();}catch(e){alert(e.message)}};refresh.onclick=load;load();
</script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script></body></html>
