<main class="admin-main"><h1>Analytics</h1><p>Business analytics without raw logs or code.</p><div class="kpi-grid"><div class="kpi">Page Views<b id="pv">—</b></div><div class="kpi">Shop Clicks<b id="sc">—</b></div><div class="kpi">Repair Leads<b id="rl">—</b></div><div class="kpi">WhatsApp Clicks<b id="wc">—</b></div><div class="kpi">Feedback<b id="fb">—</b></div></div><section class="cms-section" style="margin-top:18px"><h3>Events</h3><table class="admin-table"><tbody id="rows"></tbody></table></section><script>(async()=>{try{var d=await pmtGet("analytics");pv.textContent=d.pageViews||0;sc.textContent=d.shopClicks||0;rl.textContent=d.repairLeads||0;wc.textContent=d.whatsappClicks||0;fb.textContent=d.feedback||0;rows.innerHTML=(d.events||[]).map(function(x){return '<tr><td>'+escapeHtml(x.name)+'</td><td>'+Number(x.count||0)+'</td></tr>'}).join("")}catch(e){rows.innerHTML='<tr><td>Analytics API not configured.</td></tr>'}})();</script></main><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script></body></html>
