<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Owner Control Room</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body">
<header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header>
<aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="feedback.html">Feedback</a><a href="analytics.html">Analytics</a><a href="media.html">Media & Uploads</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside>
<main class="admin-main"><h1>Repairs</h1><p>Manage repair tickets, estimates and status.</p><section class="cms-section"><div class="admin-actions"><button class="btn" id="refresh">↻ Refresh</button></div><div class="table-wrap" style="margin-top:15px"><table class="admin-table"><thead><tr><th>Name/ID</th><th>Device</th><th>Issue</th><th>Status</th><th>Estimate</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script>async function load(){try{const d=await pmtGet("repairs"),a=d?.items||[];rows.innerHTML=a.map(x=>`<tr><td>${escapeHtml(x.name)}<br><small>${escapeHtml(x.id)}</small></td><td>${escapeHtml(x.device)}</td><td>${escapeHtml(x.issue)}</td><td><select onchange='setRepair("${escapeHtml(x.id)}",this.value)'>${["Pending","Received","Diagnosing","Repairing","Ready","Delivered","Cancelled","Completed"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></td><td>₹${Number(x.estimate||0)}</td></tr>`).join("")||'<tr><td colspan="5">No records yet.</td></tr>';}catch(e){rows.innerHTML='<tr><td colspan="5">'+escapeHtml(e.message||"API request failed")+'</td></tr>';}}async function setRepair(id,status){try{await pmtPost({action:"updateRepair",payload:{id,status}});load();}catch(e){alert(e.message)}}refresh.onclick=load;load();</script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script></body></html>
