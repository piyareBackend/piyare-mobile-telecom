<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media & Uploads</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Control Room</b><a href="dashboard.html">Dashboard</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="media.html">Media</a><a href="backup.html">Backup</a><a href="security.html">Security</a></aside><main class="admin-main"><h1>Media & Uploads</h1><p>Public website images go to the dedicated media folder. Backup files stay private.</p><section class="cms-section"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn btn-blue" id="upload">Upload</button><p id="status"></p></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>upload.onclick=async()=>{try{const f=file.files[0];if(!f)throw Error("Choose an image.");if(f.size>5242880)throw Error("Maximum 5 MB.");if(!["image/jpeg","image/png","image/webp"].includes(f.type))throw Error("Only JPG, PNG and WebP.");const b=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});const d=await pmtPost({action:"uploadImage",filename:f.name,mime:f.type,base64:b});status.textContent="Uploaded: "+d.url}catch(e){status.textContent=e.message}};</script></body></html>
