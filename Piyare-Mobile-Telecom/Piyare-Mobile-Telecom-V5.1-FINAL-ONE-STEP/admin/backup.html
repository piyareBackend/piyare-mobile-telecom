<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backup / Restore</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body"><header class="admin-top"><b>PMT Control Room</b><a href="dashboard.html">Dashboard</a></header><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="backup.html">Backup / Restore</a><a href="security.html">Security</a></aside><main class="admin-main"><h1>Backup / Restore</h1><section class="cms-section"><h3>Create backup</h3><p>A verified snapshot of the Sheets database is stored in the private Google Drive backup folder.</p><button class="btn btn-blue" id="make">Create Backup</button><p id="out"></p></section><section class="cms-section"><h3>Restore</h3><p>Paste the Drive file ID from a backup. A fresh pre-restore backup is created automatically.</p><input id="id" placeholder="Google Drive backup file ID"><button class="btn" id="restore">Restore Snapshot</button><p id="status"></p></section><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script><script>make.onclick=async()=>{try{let d=await pmtPost({action:"createBackup"});out.textContent="Backup created: "+d.name+" · ID: "+d.id}catch(e){out.textContent=e.message}};restore.onclick=async()=>{if(!id.value.trim())return;try{let d=await pmtPost({action:"restoreBackup",snapshotId:id.value.trim()});status.textContent=d.message||"Restored"}catch(e){status.textContent=e.message}};</script></main></body></html>
