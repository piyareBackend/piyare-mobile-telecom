<main class="admin-main"><h1>Feedback</h1><p>Read customer feedback.</p><section class="cms-section"><button class="btn btn-blue" id="load">Refresh</button><div id="cards" style="margin-top:15px">Loading…</div></section><script>async function loadF(){try{var d=await pmtGet("feedback");cards.innerHTML=(d.feedback||[]).map(function(x){return '<div class="repeat-row"><b>'+escapeHtml(x.name||"Customer")+'</b> <span class="badge">'+escapeHtml(x.status||"New")+'</span><p>'+escapeHtml(x.message||"")+'</p><small>'+escapeHtml(x.date||"")+'</small></div>'}).join("")||"No feedback yet."}catch(e){cards.textContent="API not configured."}}load.onclick=loadF;loadF();</script></main><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script></body></html>
