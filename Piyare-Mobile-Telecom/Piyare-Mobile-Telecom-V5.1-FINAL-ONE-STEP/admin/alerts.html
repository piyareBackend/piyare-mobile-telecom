</aside><main class="admin-main"><h1>Low Stock Alerts</h1><p>Products below their configured minimum stock threshold.</p><section class="cms-section"><div id="list">Loading…</div></section>
<script>(async()=>{try{let d=await pmtGet("lowStock");list.innerHTML=(d.items||[]).map(x=>'<div class="alert">'+escapeHtml(x.name)+' — '+Number(x.stock||0)+' left (minimum '+Number(x.minimum||0)+')</div>').join("")||'<div class="alert success">No low-stock items.</div>'}catch(e){list.textContent="API not configured."}})();</script></main><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script></body></html>
