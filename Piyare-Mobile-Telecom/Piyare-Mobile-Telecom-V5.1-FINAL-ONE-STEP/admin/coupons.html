<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMT Owner Control Room</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-body">
<header class="admin-top"><b>PMT Owner Control Room</b><a href="../index.html" target="_blank" rel="noopener">View Website</a></header>
<aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="editor.html">Website Editor</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="repairs.html">Repairs</a><a href="coupons.html">Coupons</a><a href="customers.html">Customers</a><a href="feedback.html">Feedback</a><a href="analytics.html">Analytics</a><a href="media.html">Media & Uploads</a><a href="settings.html">Settings</a><a href="security.html">Security</a></aside>
<main class="admin-main"><h1>Coupons</h1><p>Manage discount codes and expiry.</p><section class="cms-section"><div class="admin-actions"><button class="btn btn-blue" id="add">＋ Add New</button><button class="btn" id="refresh">↻ Refresh</button></div><div class="table-wrap" style="margin-top:15px"><table class="admin-table"><thead><tr><th>Code</th><th>Value</th><th>Expires</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script>async function load(){try{const d=await pmtGet("coupons"),a=d?.items||[];rows.innerHTML=a.map(x=>`<tr><td>${escapeHtml(x.code)}</td><td>${x.type==="flat"?"₹"+Number(x.value):Number(x.value)+"%"}</td><td>${escapeHtml(x.expires||"—")}</td><td>${x.active?"Active":"Inactive"}</td><td><button class="btn" onclick='editCoupon(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")||'<tr><td colspan="5">No records yet.</td></tr>';}catch(e){rows.innerHTML='<tr><td colspan="5">'+escapeHtml(e.message||"API request failed")+'</td></tr>';}}async function editCoupon(x){const value=prompt("Value:",x.value);if(value===null)return;const expires=prompt("Expiry (optional):",x.expires||"");if(expires===null)return;try{await pmtPost({action:"updateCoupon",payload:{id:x.id,value:Number(value),expires}});load();}catch(e){alert(e.message)}}refresh.onclick=load;load();add.onclick=async()=>{const code=prompt("Coupon code:");if(!code)return;const type=prompt("Type: percent or flat","percent");if(!type)return;const value=prompt("Value:","10");if(value===null)return;const expires=prompt("Expiry (optional):","")||"";try{await pmtPost({action:"createCoupon",payload:{code,type,value:Number(value),expires,active:true}});load();}catch(e){alert(e.message)}};</script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script></body></html>
