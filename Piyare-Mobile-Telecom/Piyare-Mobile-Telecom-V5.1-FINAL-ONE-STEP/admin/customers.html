<main class="admin-main"><h1>Customers</h1><p>Customer records with privacy masking.</p><section class="cms-section"><button class="btn btn-blue" id="load">Load Customers</button><div class="table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Phone</th><th>Orders</th><th>Last Activity</th></tr></thead><tbody id="rows"></tbody></table></div></section><script>load.onclick=async function(){try{var d=await pmtGet("customers");rows.innerHTML=(d.customers||[]).map(function(x){return '<tr><td>'+escapeHtml(x.name)+'</td><td>'+escapeHtml(x.phoneMasked||'••••••••••')+'</td><td>'+Number(x.orders||0)+'</td><td>'+escapeHtml(x.lastActivity||'—')+'</td></tr>'}).join("")||'<tr><td colspan="4">No customers.</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="4">API not configured.</td></tr>'}};</script></main><script src="../assets/js/admin.js"></script><script src="../assets/js/security.js"></script></body></html>
